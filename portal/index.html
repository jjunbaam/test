<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DLPCenter 변경 영향 검토</title><style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#203044;background:#f3f6fa;line-height:1.65}*{box-sizing:border-box}body{margin:0}header{background:#112d46;color:white;padding:25px max(24px,calc((100vw - 1240px)/2));}header small{color:#a9c8dc}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 15px}h3{font-size:17px;margin:0 0 8px}h4{margin:10px 0}main{max-width:1290px;margin:25px auto;padding:0 24px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px}section,.card{background:#fff;border:1px solid #dfe6ed;border-radius:12px;padding:22px;margin-bottom:18px;overflow-wrap:anywhere}.sub{color:#617183;font-size:13px}.notice{border-left:4px solid #d89224;padding:12px;background:#fff7e8;font-size:14px;margin:12px 0}.error{color:#9e2636;background:#fff0f2;padding:12px;border-radius:7px;white-space:pre-wrap}.ok{color:#12634c}label{display:block;font-size:14px;margin:12px 0 6px}input,select,textarea,button{font:inherit}input[type=text],select,textarea{width:100%;border:1px solid #b9c7d4;background:white;border-radius:7px;padding:9px}button{cursor:pointer;border:0;border-radius:7px;padding:9px 14px;background:#1761a0;color:white;margin:7px 5px 0 0;font-size:14px}button.secondary{background:#e9f0f6;color:#264b6a}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.commit{display:flex;gap:10px;border-bottom:1px solid #edf0f4;padding:9px 0;margin:0;font-size:13px}.commit input{flex:none}.commit small{display:block;color:#687c8e}.commits{max-height:350px;overflow:auto}.tag{display:inline-block;background:#eaf1f8;color:#315e82;font-size:12px;border-radius:5px;padding:2px 8px;margin:0 6px 5px 0}.risk{border-top:1px solid #e1e8ee;padding-top:14px;margin-top:14px}details{border-top:1px solid #e3eaf0;padding-top:10px;margin-top:12px}summary{cursor:pointer;color:#315e82;font-size:13px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fa;padding:12px;border-radius:6px}.status{white-space:pre-wrap;font-size:14px}a{color:#1761a0}ul,ol{padding-left:22px}.empty{padding:50px 20px;text-align:center;color:#667b8e}.target{border-top:3px solid #1761a0;padding-top:20px;margin-top:25px}.manual{background:#f5f8fa;padding:14px;border-radius:8px;margin-top:15px}@media(max-width:850px){main{grid-template-columns:1fr}header{padding:20px}main{padding:0 12px}.commits{max-height:230px}}
</style></head><body><header><small>DLPCenter · QA WORKSPACE</small><h1>변경 영향 검토</h1><div>Branch 작업이 반영될 때, 확인할 화면과 기능을 찾습니다.</div></header><main><aside><section><h2>1. 사내 연결 확인</h2><div id="settings" class="sub">설정을 읽는 중입니다.</div><button id="check" class="secondary">GitLab · Sourcegraph · Pi 확인</button><div id="checks" class="status"></div></section><section><h2>2. 개발 작업 선택</h2><label for="search">개발 Branch 검색</label><div class="row"><input id="search" type="text" placeholder="Branch 이름 일부"><button id="find">조회</button></div><label for="branch">개발 Branch</label><select id="branch"><option value="">먼저 Branch를 조회하세요</option></select><button id="load" class="secondary">커밋 불러오기</button><div id="commits" class="commits"></div><button id="more" class="secondary" hidden>다음 커밋 더 보기</button><div id="selection" class="sub"></div><label>반영 대상</label><div id="targets"></div><div class="notice">선택 커밋을 대상 코드에 순서대로 적용해 분석합니다. 실제 반영 절차가 전체 merge 또는 수동 수정이면 결과가 달라질 수 있습니다.</div><button id="analyze">선택 변경 분석</button><div id="inputError"></div></section><section><h2>저장된 분석</h2><button id="historyRefresh" class="secondary">목록 새로고침</button><div id="history"></div></section></aside><article><section><h2>분석 상태</h2><div id="progress" class="status">개발 작업과 반영 대상을 선택하세요.</div></section><div id="report"><section class="empty">분석하면 실제 코드에서 찾은 화면 후보와<br>예상 사이드이펙트, 확인이 필요한 항목이 표시됩니다.</section></div></article></main><script>
'use strict';
const $=id=>document.getElementById(id);let page=1,selected=new Map(),current=null,busy=false,loadedBranch='';
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;};
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'요청 실패');return j;}
function error(target,e){$(target).replaceChildren(el('div',e.message||String(e),'error'));}
function bind(id,fn){$(id).onclick=async()=>{const b=$(id);b.disabled=true;try{await fn();}catch(e){error('inputError',e);}finally{b.disabled=false;}};}
function list(parent,values){const u=el('ul');for(const value of values||[])u.append(el('li',value));parent.append(u);}
function field(parent,name,value){const p=el('p');p.append(el('strong',name+' '),document.createTextNode(value||'미확인'));parent.append(p);}
async function init(){try{const s=await api('/api/settings');$('settings').textContent=`GitLab 프로젝트 ${s.project_id} · 화면 카탈로그 ${s.catalog_present?'있음':'없음'} · 연결 상태는 아직 확인하지 않았습니다.`;for(const [label,branch] of Object.entries(s.targets)){const l=el('label');const c=el('input');c.type='checkbox';c.value=label;l.append(c,document.createTextNode(` ${label} — ${branch}`));$('targets').append(l);}await loadHistory();}catch(e){error('settings',e);}}
bind('check',async()=>{
    const settings=await api('/api/settings');
    const checks=[{name:'GitLab',path:'gitlab'},{name:'Sourcegraph',path:'sourcegraph'},{name:'Pi',path:'pi'},...Object.keys(settings.targets).map(label=>({name:label+' 브랜치',path:'target?label='+encodeURIComponent(label)}))];
    $('checks').replaceChildren(el('p','각 연결을 따로 확인합니다. Pi 응답 대기는 최대 60초, 화면의 요청 대기는 최대 90초입니다.','sub'));
    const started=Date.now();
    await Promise.allSettled(checks.map(async check=>{
        const row=el('p',check.name+': 확인 중… 0초','status');$('checks').append(row);
        const interval=setInterval(()=>{row.textContent=check.name+': 확인 중… '+Math.floor((Date.now()-started)/1000)+'초';},1000);
        const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),90000);
        try{
            const response=await fetch('/api/checks/'+check.path,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:controller.signal});
            const result=await response.json();if(!response.ok)throw Error(result.error||'연결 검사 요청 실패');
            row.textContent=check.name+': '+result.status+' ('+Math.floor((Date.now()-started)/1000)+'초)\n'+result.message;
            row.className=result.status==='ok'?'ok':'status';
        }catch(e){row.textContent=check.name+': '+(e.name==='AbortError'?'90초 안에 포털 서버 응답을 받지 못했습니다. PowerShell 서버 상태를 확인하세요.':e.message);row.className='error';}
        finally{clearInterval(interval);clearTimeout(timeout);}
    }));
});
bind('find',async()=>{const data=await api('/api/branches?search='+encodeURIComponent($('search').value));$('branch').replaceChildren(el('option','Branch 선택'));$('branch').firstChild.value='';for(const b of data.items){const o=el('option',b.name);o.value=b.name;$('branch').append(o);}});
$('branch').onchange=()=>{selected.clear();loadedBranch='';$('commits').replaceChildren();$('more').hidden=true;updateSelection();};
function updateSelection(){$('selection').textContent=selected.size+'개 커밋 선택 · 최대 30개';}
async function loadCommits(reset){const branch=$('branch').value;if(!branch)throw Error('개발 Branch를 선택하세요.');if(reset){page=1;selected.clear();$('commits').replaceChildren();}const data=await api('/api/commits?branch='+encodeURIComponent(branch)+'&page='+page);loadedBranch=branch;for(const c of data.items){const l=el('label',undefined,'commit'),box=el('input'),text=el('span',c.title);box.type='checkbox';box.onchange=()=>{if(box.checked)selected.set(c.sha,c);else selected.delete(c.sha);updateSelection();};text.append(el('small',c.sha.slice(0,10)+' · '+c.author+' · '+c.date));l.append(box,text);$('commits').append(l);}page=data.next_page?Number(data.next_page):null;$('more').hidden=!page;updateSelection();}
bind('load',()=>loadCommits(true));bind('more',()=>loadCommits(false));
bind('analyze',async()=>{if(busy)throw Error('분석이 진행 중입니다.');if(!selected.size)throw Error('커밋을 선택하세요.');if(selected.size>30)throw Error('최대 30개 커밋을 선택하세요.');if(loadedBranch!==$('branch').value)throw Error('현재 Branch의 커밋을 다시 조회하세요.');const targets=[...$('targets').querySelectorAll('input:checked')].map(x=>x.value);if(!targets.length)throw Error('PR 또는 R을 선택하세요.');$('inputError').replaceChildren();const job=await api('/api/analyze',{source_branch:loadedBranch,commits:[...selected.keys()],targets});busy=true;try{while(true){const state=await api('/api/jobs/'+job.id);$('progress').textContent=state.message;if(state.status==='error')throw Error(state.message);if(state.status==='complete'){await openReport(job.id);await loadHistory();break;}await new Promise(r=>setTimeout(r,2000));}}finally{busy=false;}});
async function loadHistory(){const data=await api('/api/reports');$('history').replaceChildren();for(const item of data.items){const b=el('button',item.source_branch+' · '+new Date(item.created_at).toLocaleString(),'secondary');b.onclick=()=>openReport(item.id).catch(e=>error('inputError',e));$('history').append(b);}if(!data.items.length)$('history').append(el('p','저장된 분석이 없습니다.','sub'));}
bind('historyRefresh',loadHistory);
async function openReport(id){current=await api('/api/reports/'+id);render(current);}
function render(report){const root=$('report');root.replaceChildren();const head=el('section');head.append(el('h2','분석 결과'),el('div',report.source_branch+' · '+report.source_sha,'sub'),el('p',report.application_mode),el('div',report.assumption,'notice'));const a=el('a','분석 JSON 다운로드');a.href='/api/reports/'+report.id+'?download=1';head.append(a);list(head,report.warnings);root.append(head);
for(const target of report.targets){const area=el('section',undefined,'target');area.append(el('h2',target.label+' · '+target.branch),el('div','대상 SHA: '+target.target_sha,'sub'));const statuses={conflict:'적용 충돌 — 영향 분석 보류',no_change:'적용 후 코드 차이 없음',applied:'패치 적용 시뮬레이션 완료'};area.append(el('p',statuses[target.status]||target.status));if(target.message)area.append(el('div',target.message,'notice'));list(area,target.warnings);const apply=el('details');apply.append(el('summary','선택 커밋별 적용 결과'));list(apply,target.commits.map(c=>c.sha.slice(0,12)+' · '+c.status));area.append(apply);if(target.coverage){const coverage=el('details');coverage.append(el('summary','분석 범위 및 Sourcegraph 조회 기록'),el('pre',JSON.stringify({coverage:target.coverage,sourcegraph:target.sourcegraph},null,2)));area.append(coverage);}if(target.unresolved_files.length){area.append(el('h3','화면을 확인하지 못한 변경'),el('p','영향 없음이 아닙니다. 라우트·메뉴 매핑을 보완해야 합니다.','sub'));list(area,target.unresolved_files);}if(target.status==='applied'&&!target.screens.length)area.append(el('div','확인 가능한 화면 후보를 찾지 못했습니다. 실제 화면 카탈로그와 동적 연결을 확인하세요.','notice'));
for(const finding of target.screens){const card=el('div',undefined,'card'),screen=finding.screen;card.append(el('span',screen.menu_verified?'카탈로그 메뉴 확인':'메뉴 경로 미확인','tag'),el('span','영향 후보 · 결함 확정 아님','tag'),el('h3',screen.name),el('p',screen.menu_path||'메뉴 경로를 확인하지 못했습니다.'),el('div',screen.identity_source,'sub'));if(finding.before_only)card.append(el('div','반영 전 코드에서만 연결된 화면입니다. 삭제·연결 변경 여부를 확인하세요.','notice'));if(finding.ai_status!=='complete')card.append(el('div','AI 분석 '+finding.ai_status+': '+finding.ai_error,'error'));else{if(!finding.analysis.risks.length)card.append(el('p','제공된 근거에서 구체적인 위험을 도출하지 못했습니다. 안전함을 보장하는 결과는 아닙니다.','sub'));for(const risk of finding.analysis.risks){const box=el('div',undefined,'risk');box.append(el('h4',risk.feature));field(box,'발생 조건',risk.condition);field(box,'예상 사이드이펙트',risk.symptom);field(box,'근거와 이유',risk.reason);box.append(el('strong','수동 검증 순서'));const steps=el('ol');for(const step of risk.steps)steps.append(el('li',step));box.append(steps);field(box,'정상 기대 결과',risk.expected_result);box.append(el('div','근거 ID: '+risk.evidence_ids.join(', '),'sub'));card.append(box);}if(finding.analysis.uncertainties.length){card.append(el('h4','추가 확인이 필요한 점'));list(card,finding.analysis.uncertainties);}}
const evidence=el('details');evidence.append(el('summary','코드 → 화면 추적 근거'));for(const e of finding.evidence){evidence.append(el('h4',e.id+' · '+e.kind),el('div','리비전: '+e.revision,'sub'),el('pre',e.changed_file+'\n'+e.chain.map(edge=>' → '+edge.to+':'+edge.line+' ['+edge.reason+']').join('\n')+'\n화면 파일: '+e.screen_file));}card.append(evidence);manual(card,report,target,finding);area.append(card);}root.append(area);}}
function manual(card,report,target,finding){const key=target.label+':'+finding.screen.id,saved=report.manual_checks[key]||{},box=el('div',undefined,'manual');box.append(el('h4','반영 후 수동 검증 기록'));const status=el('select');for(const [value,label]of Object.entries({not_run:'미실행',pass:'통과',fail:'실패',blocked:'진행 불가'})){const o=el('option',label);o.value=value;status.append(o);}status.value=saved.status||'not_run';const sha=el('input');sha.type='text';sha.placeholder='실제 배포 커밋 전체 SHA (알고 있는 경우)';sha.value=saved.deployed_sha||'';const note=el('textarea');note.rows=2;note.placeholder='검증 조건과 관찰 결과';note.value=saved.note||'';const save=el('button','검증 기록 저장','secondary'),message=el('div',undefined,'sub');save.onclick=async()=>{save.disabled=true;try{await api('/api/reports/'+report.id+'/check',{key,status:status.value,deployed_sha:sha.value,note:note.value});message.textContent='저장했습니다. 배포 SHA는 사용자 입력이며 자동 대조하지 않았습니다.';}catch(e){message.textContent=e.message;}finally{save.disabled=false;}};box.append(status,sha,note,save,message,el('p','화면 단위 검증 기록입니다. 실제 배포 코드와 시뮬레이션 결과가 같은지는 별도 확인이 필요합니다.','sub'));card.append(box);}
init();
</script></body></html>
